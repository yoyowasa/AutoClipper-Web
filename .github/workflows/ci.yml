name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: cd backend && python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint backend
        run: cd backend && ruff check . ../launcher

      - name: Test backend
        run: cd backend && pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm --workspace frontend run lint

      - name: Typecheck frontend
        run: npm --workspace frontend run typecheck

      - name: Build frontend
        run: npm --workspace frontend run build
