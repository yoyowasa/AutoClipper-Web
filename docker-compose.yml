services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BACKEND_CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:////app/storage/autoclipper.db
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: autoclipper
      STORAGE_ROOT: /app/storage
      ASS_FONTS_DIR: /app/fonts
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-8589934592}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./frontend/public/fonts/SourceHanSansJP-Heavy.otf:/app/fonts/SourceHanSansJP-Heavy.otf:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DATABASE_URL: sqlite:////app/storage/autoclipper.db
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: autoclipper
      STORAGE_ROOT: /app/storage
      ASS_FONTS_DIR: /app/fonts
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-8589934592}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AUTOCLIPPER_RUNTIME_PROFILE: cpu
    volumes:
      - ./storage:/app/storage
      - ./frontend/public/fonts/SourceHanSansJP-Heavy.otf:/app/fonts/SourceHanSansJP-Heavy.otf:ro
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  redis_data:
